<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 250 56" fill="none" width="100%" height="100%">
  <!-- Left Meraas Architectural Icon -->
  <g fill="#000000">
    <!-- Top & Bottom horizontal framing bars -->
    <rect x="10" y="2" width="46" height="7" />
    <rect x="10" y="47" width="46" height="7" />
    <!-- Left & Right vertical outer brackets -->
    <rect x="0" y="16" width="7" height="38" />
    <rect x="61" y="16" width="7" height="38" />
    <!-- 3 inner pillar bars -->
    <rect x="15" y="16" width="7" height="24" rx="1" />
    <rect x="29.5" y="16" width="7" height="24" rx="1" />
    <rect x="44" y="16" width="7" height="24" rx="1" />
  </g>
  <!-- MERAAS Text -->
  <text x="82" y="44" font-family="'Inter', 'Arial Black', -apple-system, sans-serif" font-size="44" font-weight="900" fill="#000000" letter-spacing="0.04em">MERAAS</text>
</svg>
